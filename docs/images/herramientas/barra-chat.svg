<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Esquema de la barra de escritura del chat de Open WebUI</title>
  <style>
    .card { fill: #ffffff; stroke: #d0d5dd; }
    .title { font-size: 14px; font-weight: 600; fill: #1f2937; }
    .note { font-size: 12px; fill: #6b7280; }
    .ph { font-size: 15px; fill: #9ca3af; }
    .btn { fill: #f3f4f6; stroke: #d0d5dd; }
    .btnt { font-size: 13px; fill: #374151; }
    .send { fill: #111827; }
    .sendt { font-size: 13px; fill: #ffffff; font-weight: 600; }
    .num { fill: #2563eb; }
    .numt { font-size: 12px; fill: #ffffff; font-weight: 700; }
    .leg { font-size: 13px; fill: #1f2937; }
    .legb { font-size: 13px; fill: #1f2937; font-weight: 600; }
    .lead { stroke: #2563eb; stroke-width: 1.5; fill: none; }
  </style>
  <rect x="0.5" y="0.5" width="759" height="299" rx="12" fill="#f8f9fb" stroke="#e5e7eb"/>
  <text x="24" y="32" class="title">Barra de escritura del chat</text>
  <text x="736" y="32" class="note" text-anchor="end">Esquema · textos de Open WebUI 0.11.3</text>

  <!-- input box -->
  <rect x="24" y="50" width="712" height="112" rx="18" class="card"/>
  <text x="48" y="86" class="ph">Enviar un Mensaje</text>

  <!-- left buttons -->
  <rect x="44" y="114" width="34" height="32" rx="16" class="btn"/>
  <text x="61" y="136" class="btnt" text-anchor="middle" font-size="18">+</text>
  <rect x="88" y="114" width="118" height="32" rx="16" class="btn"/>
  <text x="147" y="135" class="btnt" text-anchor="middle">Herramientas</text>
  <rect x="216" y="114" width="118" height="32" rx="16" class="btn"/>
  <text x="275" y="135" class="btnt" text-anchor="middle">Integraciones</text>

  <!-- right buttons -->
  <rect x="566" y="114" width="70" height="32" rx="16" class="btn"/>
  <text x="601" y="135" class="btnt" text-anchor="middle">Dictar</text>
  <rect x="646" y="114" width="74" height="32" rx="16" class="send"/>
  <text x="683" y="135" class="sendt" text-anchor="middle">Enviar</text>

  <!-- callout markers -->
  <circle cx="61" cy="178" r="10" class="num"/><text x="61" y="182" class="numt" text-anchor="middle">1</text>
  <path d="M61 168 V148" class="lead"/>
  <circle cx="147" cy="178" r="10" class="num"/><text x="147" y="182" class="numt" text-anchor="middle">2</text>
  <path d="M147 168 V148" class="lead"/>
  <circle cx="275" cy="178" r="10" class="num"/><text x="275" y="182" class="numt" text-anchor="middle">3</text>
  <path d="M275 168 V148" class="lead"/>

  <!-- legend -->
  <circle cx="36" cy="214" r="9" class="num"/><text x="36" y="218" class="numt" text-anchor="middle">1</text>
  <text x="54" y="218" class="legb">Más (+)</text>
  <text x="120" y="218" class="leg">Subir Archivos, Adjuntar Conocimiento, Adjuntar Página Web, Referenciar Chats.</text>
  <circle cx="36" cy="242" r="9" class="num"/><text x="36" y="246" class="numt" text-anchor="middle">2</text>
  <text x="54" y="246" class="legb">Herramientas</text>
  <text x="160" y="246" class="leg">Herramientas MCP del servidor: time (hora) y fetch (leer páginas web).</text>
  <circle cx="36" cy="270" r="9" class="num"/><text x="36" y="274" class="numt" text-anchor="middle">3</text>
  <text x="54" y="274" class="legb">Integraciones</text>
  <text x="166" y="274" class="leg">Búsqueda Web (SearXNG), Interprete de Código y Terminal (Open Terminal).</text>
</svg>
